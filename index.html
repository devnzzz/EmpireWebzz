<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebzEmpire - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('ThemaBG.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: brightness(0.5);
            padding: 20px;
        }

        .login-container {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.18);
        }

        .rainbow-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 2s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes rainbow {
            to { filter: hue-rotate(360deg); }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            color: white;
            font-size: 13px;
            display: block;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            background: rgba(255,255,255,0.2);
            border-color: #1e88e5;
        }

        /* TOMBOL GET AKSES - DIKECILIN */
        .btn-akses {
            width: auto;
            padding: 8px 20px;
            background: #1e88e5;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-akses:hover {
            background: #0d47a1;
            transform: scale(1.02);
        }

        .toast-iphone {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 1000;
            white-space: nowrap;
        }

        .toast-iphone.show {
            opacity: 1;
            visibility: visible;
        }

        .toast-success {
            background: rgba(52, 199, 89, 0.95);
        }

        .toast-error {
            background: rgba(255, 59, 48, 0.95);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="rainbow-text">WebzEmpire</div>
    
    <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
    </div>
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
    </div>
    
    <button class="btn-akses" id="getAksesBtn">Get Akses</button>
</div>

<div id="toastMsg" class="toast-iphone"></div>

<script src="auth.js"></script>
</body>
</html>
