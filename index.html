<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebzEmpire - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: url('ThemaBG.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: brightness(0.5);
            padding: 20px;
        }
        .login-container {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .rainbow-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 2s linear infinite;
            margin-bottom: 30px;
        }
        @keyframes rainbow { to { filter: hue-rotate(360deg); } }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { color: white; font-size: 13px; display: block; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 14px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: white; font-size: 15px;
            outline: none;
        }
        .btn-login {
            width: auto; padding: 8px 24px; background: #1e88e5;
            border: none; border-radius: 24px; font-size: 14px;
            font-weight: 600; color: white; cursor: pointer;
            margin-top: 10px; display: inline-block;
        }
        .btn-login:hover { background: #0d47a1; transform: scale(1.02); }
        .login-hint { margin-top: 12px; font-size: 11px; color: rgba(255,255,255,0.5); }
        .login-hint a { color: #1e88e5; text-decoration: none; }
        .toast-iphone {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(28,28,30,0.95); backdrop-filter: blur(20px);
            color: white; padding: 14px 24px; border-radius: 50px;
            font-size: 15px; opacity: 0; visibility: hidden;
            transition: all 0.3s; z-index: 1000;
            white-space: nowrap;
        }
        .toast-iphone.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .maintenance-box {
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            border-radius: 28px; padding: 45px 35px; text-align: center;
            display: none;
        }
        .maintenance-icon { font-size: 60px; animation: spin 2s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .maintenance-box h1 { color: #ff9800; margin-bottom: 15px; }
        .maintenance-box p { color: white; }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container">
    <div class="rainbow-text">WebzEmpire</div>
    <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
    </div>
    <div class="input-group">
        <label>Key</label>
        <input type="password" id="password" placeholder="Masukkan key dari bot">
    </div>
    <button class="btn-login" id="loginBtn">Login</button>
    <div class="login-hint">
        Belum punya akses? <a href="#" id="getAksesLink">Klik disini</a>
    </div>
</div>

<div id="maintenanceBox" class="maintenance-box">
    <div class="maintenance-icon">⚙️🔧</div>
    <h1>Maintenance</h1>
    <p>Soon, Sedang Masa Maintenance</p>
    <small style="color:rgba(255,255,255,0.5)">Akan kembali segera</small>
</div>

<div id="toastMsg" class="toast-iphone"></div>

<script>
    // 🔧 NANTI GANTI URL INI SETELAH BOT JADI DI RENDER 🔧
    // Ganti 'GANTI_DENGAN_URL_RENDER_KAMU' dengan URL bot asli
    // Contoh: const BOT_API = 'https://webzempire-bot.onrender.com/api';
    const BOT_API = 'https://c0f9e5f4b68e9d5cec-103-216-221-82.serveo.net';
    
    let toastTimeout, cooldown = false;
    function showToast(msg, isError = true) {
        if (cooldown && isError) return;
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.background = isError ? "rgba(255,59,48,0.95)" : "rgba(52,199,89,0.95)";
        toast.classList.add('show');
        if (isError) cooldown = true;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
            if (isError) setTimeout(() => { cooldown = false; }, 500);
        }, 10000);
    }
    
    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const key = document.getElementById('password').value.trim();
        
        if (!username || !key) {
            showToast('❌ Isi username & key!');
            return;
        }
        if (cooldown) {
            showToast('⏳ Tunggu 10 detik!');
            return;
        }
        
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '⏳...';
        
        try {
            const response = await fetch(`${BOT_API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, key })
            });
            const result = await response.json();
            
            if (result.ok) {
                showToast(`✅ Berhasil Login. Welcome ${username}`, false);
                setTimeout(() => {
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('maintenanceBox').style.display = 'block';
                }, 500);
            } else {
                showToast('❌ Gagal! Key tidak valid atau expired.');
            }
        } catch (error) {
            console.log('Error:', error);
            showToast('❌ Gagal konek ke server bot!');
        }
        
        btn.disabled = false;
        btn.textContent = 'Login';
    }
    
    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('username').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('password').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });
    document.getElementById('getAksesLink').addEventListener('click', (e) => {
        e.preventDefault();
        window.open('https://t.me/YOUR_BOT_USERNAME', '_blank');
    });
    
    console.log('✅ WebzEmpire Ready!');
</script>
</body>
</html>
